# Corre el pipeline completo contra el Supabase remoto (TRD 11.3).
# Es el mismo comando que en local: solo cambian las variables, que llegan de GitHub Secrets.
# Estilo y pruebas viven en ci.yml: aquí no bloquean la lista del día.
name: pipeline-leads

on:
  # El disparo principal es pg_cron en Supabase a las 06:17 (migración disparo_diario_pipeline), que
  # llama a workflow_dispatch: el cron de GitHub no garantiza la hora y aquí no llegó a disparar.
  # Este queda de respaldo, media hora después; si corren los dos, la lista sale igual (idempotente).
  schedule:
    - cron: "47 11 * * *" # 06:47 America/Bogota (GitHub usa UTC)
  # Llegan insumos nuevos: la lista se recalcula sin esperar al día siguiente.
  push:
    branches: [main]
    paths: ["data/raw/**"]
  workflow_dispatch:
    inputs:
      fecha_corte:
        description: "YYYY-MM-DD (vacío = última fecha de registro)"
        required: false
      extractor:
        description: "gemini | reglas"
        type: choice
        options: [gemini, reglas]
        default: gemini
      # Lo envía el cron de Supabase para que la base registre la corrida como supabase_cron.
      disparador:
        description: "manual | supabase_cron"
        type: choice
        options: [manual, supabase_cron]
        default: manual

# Dos corridas a la vez escribirían la misma lista: la segunda espera a que termine la primera.
concurrency:
  group: pipeline-leads
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # para abrir el aviso cuando la corrida falla

jobs:
  run:
    runs-on: ubuntu-latest
    # La primera corrida con Gemini hace ~68 peticiones con pausa entre ellas; las siguientes usan la
    # caché de la base y tardan segundos.
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      # En el cron y en el push no hay entradas: se cae a los valores por defecto.
      EXTRACTOR: ${{ inputs.extractor || 'gemini' }}
      FECHA_CORTE: ${{ inputs.fecha_corte }}
      DISPARADOR: ${{ inputs.disparador }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0 # sin etiqueta mayor flotante desde la v8
      - name: Instalar el entorno bloqueado por uv.lock
        run: uv sync --frozen
      # Las migraciones se aplican a mano: si el código trae una que la base no tiene, la corrida se
      # detiene aquí en vez de escribir con un esquema viejo (y el paso de aviso abre el issue).
      - name: Comprobar que la base tiene las migraciones del repositorio
        run: uv run python -m pipeline check-migrations
      - name: Correr el pipeline
        run: uv run python -m pipeline run
      # Si el Gemini falla, la corrida termina con el respaldo por reglas y no llega aquí: esto es
      # para lo que deja la lista del día sin publicar (base caída, insumo ilegible...).
      - name: Avisar del fallo
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh issue create --repo "$GITHUB_REPOSITORY"
          --title "Falló el pipeline de leads ($(date -u +%F))"
          --body "La lista del día no se publicó. Corrida: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
