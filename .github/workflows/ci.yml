# Integración continua: estilo, pruebas y validación del puntaje en cada cambio del código.
# Va aparte del pipeline productivo: una prueba rota avisa aquí y no impide publicar la lista del día.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0 # sin etiqueta mayor flotante desde la v8
      - name: Instalar el entorno bloqueado por uv.lock
        run: uv sync --frozen
      - name: Revisar estilo
        run: uv run ruff check . && uv run ruff format --check .
      # Sin credenciales de Supabase, las pruebas de aislamiento e interfaz se omiten: el resto no
      # usa red.
      - name: Pruebas
        run: uv run pytest -q
      # Corre sobre el histórico y los pesos del commit: si un cambio en cualquiera de los dos rompe
      # el criterio de TRD 9.3, sale con código distinto de cero.
      - name: Validar el puntaje
        run: uv run python -m pipeline validate-scoring
      # Un cambio de esquema subido sin `supabase db push` deja el CI en rojo hasta aplicarlo. La
      # credencial va solo en este paso, para que las pruebas no se conecten a la base remota. En un
      # pull request desde un fork no hay secretos, así que corre solo en los push.
      - name: Comprobar migraciones en la base remota
        if: github.event_name == 'push'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m pipeline check-migrations
